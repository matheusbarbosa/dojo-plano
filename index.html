<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Judô Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Judô Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f6f6f6;
      color: #222;
    }
    header {
      background: linear-gradient(135deg, #6a1b9a, #4e342e, #000);
      color: white;
      padding: 30px 20px;
      text-align: center;
      border-bottom-left-radius: 2rem;
      border-bottom-right-radius: 2rem;
    }
    .progress-bar { height: 16px; background: #e0e0e0; border-radius: 8px; overflow: hidden; margin: 10px 0; }
    .progress-bar-fill { height: 100%; width: 0; background: #4caf50; transition: width 0.3s ease; }
    .card { background: white; border-radius: 1rem; padding: 20px; margin: 10px auto; max-width: 300px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .card a { text-decoration: none; color: inherit; font-weight: bold; display: block; text-align: center; }
    section { background: #fff; border-radius: 1rem; margin: 20px auto; padding: 20px; max-width: 960px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; border: 1px solid #ccc; text-align: left; }
    th { background: #f0f0f0; }
    input[type="checkbox"], input[type="number"] { transform: scale(1.2); }
    #darkModeToggle { margin-top: 10px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    body.dark { background: #121212; color: #eee; }
    body.dark section, body.dark .card { background: #1f1f1f; color: #eee; }
    body.dark th { background: #2c2c2c; }
    body.dark td { background: #2a2a2a; }
  </style>
</head>
<body>
  <header>
    <h1>Judô Tracker</h1>
    <h2>Progresso até a faixa preta</h2>
    <button id="darkModeToggle">Modo Escuro</button>
  </header>
  <div class="card"><a href="#gokyo1" onclick="navigateTo('gokyo1')">Go-Kyo</a></div>
  <div class="card"><a href="#nagekata1" onclick="navigateTo('nagekata1')">Nage-no-Kata</a></div>
  <div class="card"><a href="#osaekomi" onclick="navigateTo('osaekomi')">Osaekomi-waza</a></div>
  <div class="card"><a href="#shimewaza" onclick="navigateTo('shimewaza')">Shime-waza</a></div>
  <div class="card"><a href="#kansetsuwaza" onclick="navigateTo('kansetsuwaza')">Kansetsu-waza</a></div>
  <div class="card"><a href="#pontuacao" onclick="navigateTo('pontuacao')">Shodan – Pontuação</a></div>
  <main style="padding: 10px; max-width: 960px; margin: auto;">
    <section id="gokyo1">
      <details>
        <summary><strong>Go-Kyo – Grupo 1</strong></summary>
        <div class="progress-bar"><div class="progress-bar-fill" data-scope="gokyo1"></div></div>
        <table>
          <tr><th>Técnica</th><th>Link</th><th>Feito</th></tr>
          <tr><td>Deashi Harai</td><td><a href="#">🔗 Ver vídeo</a></td><td><input type="checkbox" data-scope="gokyo1" /></td></tr>
          <tr><td>Hiza Guruma</td><td><a href="#">🔗 Ver vídeo</a></td><td><input type="checkbox" data-scope="gokyo1" /></td></tr>
        </table>
      </details>
    </section>
    <section id="pontuacao">
      <details>
        <summary><strong>Shodan – Pontuação</strong></summary>
        <div class="progress-bar"><div class="progress-bar-fill" id="pontuacaoBar"></div></div>
        <table>
          <tr><th>Categoria</th><th>Atividade</th><th>Pontos</th></tr>
          <tr><td>Geral</td><td>Arbitragem</td><td><input type="number" value="0" class="input-pontos" /></td></tr>
        </table>
        <p><strong>Total: <span id="totalPontos">0</span> / 700 pontos</strong></p>
      </details>
    </section>
  </main>
  <script>
    function navigateTo(id) {
      const all = document.querySelectorAll("details");
      all.forEach(d => d.removeAttribute("open"));
      const el = document.getElementById(id);
      if (el) {
        const det = el.querySelector("details");
        if (det) det.setAttribute("open", true);
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }
    function updateProgress(scope = null) {
      const boxes = document.querySelectorAll(scope ? 'input[data-scope="' + scope + '"]' : 'input[type="checkbox"]');
      const total = boxes.length;
      const checked = [...boxes].filter(b => b.checked).length;
      const percent = total ? (checked / total) * 100 : 0;
      const bar = scope ? document.querySelector('.progress-bar-fill[data-scope="' + scope + '"]') : document.getElementById("progressBarFill");
      if (bar) bar.style.width = percent + "%";
    }
    function calcularPontuacao() {
      const inputs = document.querySelectorAll('.input-pontos');
      let total = 0;
      inputs.forEach((input, i) => {
        const val = parseInt(input.value || 0);
        total += val;
        localStorage.setItem("ponto_" + i, val);
      });
      document.getElementById("totalPontos").textContent = total;
      document.getElementById("pontuacaoBar").style.width = Math.min((total / 700) * 100, 100) + "%";
    }
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll('input[type="checkbox"]').forEach(chk => {
        chk.addEventListener("change", () => {
          updateProgress();
          updateProgress(chk.dataset.scope);
        });
      });
      document.querySelectorAll('.input-pontos').forEach((input, i) => {
        const saved = localStorage.getItem("ponto_" + i);
        if (saved !== null) input.value = saved;
        input.addEventListener("input", calcularPontuacao);
      });
      updateProgress();
      calcularPontuacao();

      const darkMode = localStorage.getItem("darkMode");
      if (darkMode === "enabled") document.body.classList.add("dark");
      document.getElementById("darkModeToggle").addEventListener("click", () => {
        document.body.classList.toggle("dark");
        localStorage.setItem("darkMode", document.body.classList.contains("dark") ? "enabled" : "disabled");
      });
    });
  </script>
</body>
</html>
