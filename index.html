
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Judô Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Judô Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f6f6f6;
      color: #222;
    }
    header {
      background: linear-gradient(135deg, #6a1b9a, #4e342e, #000);
      color: white;
      padding: 30px 20px;
      text-align: center;
      border-bottom-left-radius: 2rem;
      border-bottom-right-radius: 2rem;
    }
    h1 { margin: 0; font-size: 1.8rem; }
    h2 { margin: 5px 0 10px; font-size: 1rem; font-weight: normal; }
    .progress-container { padding: 10px 20px; max-width: 960px; margin: 0 auto; }
    .progress-bar { height: 16px; background: #e0e0e0; border-radius: 8px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0; background: #4caf50; transition: width 0.3s ease; }
    .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
    .card { background: white; border-radius: 1rem; padding: 20px; width: 200px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); text-align: center; }
    .card a { display: block; width: 100%; height: 100%; color: inherit; text-decoration: none; font-weight: bold; }
    #darkModeToggle { margin-top: 10px; font-size: 0.9rem; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; }

    body.dark { background: #121212; color: #f0f0f0; }
    body.dark .card, body.dark section { background: #1e1e1e; color: #f0f0f0; }
    body.dark th { background: #2c2c2c; }
    body.dark td { background: #202020; }
    body.dark input { background: #333; color: #f0f0f0; border: 1px solid #666; }

    @media (max-width: 768px) {
      .cards { flex-direction: column; padding: 10px; }
      .card { width: 100%; }
      table { font-size: 0.9rem; }
      section { margin: 10px; padding: 15px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Judô Tracker</h1>
    <h2>Pronto para mais um passo rumo à faixa preta?</h2>
    <button id="darkModeToggle">Modo Escuro</button>
  </header>
  <div class="progress-container">
    <div class="progress-bar"><div class="progress-bar-fill" id="progressBarFill"></div></div>
  </div>
  <div class="cards">
    <div class="card"><a href="#" onclick="navigateTo('gokyo')">Go-Kyo</a></div>
    <div class="card"><a href="#" onclick="navigateTo('nagekata1')">Kata</a></div>
    <div class="card"><a href="#" onclick="navigateTo('osaekomi')">Técnicas de Solo</a></div>
    <div class="card"><a href="#" onclick="navigateTo('shimewaza')">Estrangulamentos</a></div>
    <div class="card"><a href="#" onclick="navigateTo('kansetsuwaza')">Chaves de Braço</a></div>
    <div class="card"><a href="#" onclick="navigateTo('pontuacao')">📎 Pontuação e Links</a></div>
  </div>
  <script>
    function updateProgress(scope = null) {
      const checkboxes = document.querySelectorAll(scope ? 'input[data-scope="' + scope + '"]' : 'input[type="checkbox"]');
      const total = checkboxes.length;
      const checked = Array.from(checkboxes).filter(c => c.checked).length;
      const percent = total ? (checked / total) * 100 : 0;
      const bar = scope ? document.querySelector('.progress-bar-fill[data-scope="' + scope + '"]') : document.getElementById('progressBarFill');
      if (bar) bar.style.width = percent + '%';
    }

    document.addEventListener("DOMContentLoaded", () => {
      const checkboxes = document.querySelectorAll('input[type="checkbox"]');
      const scopes = [...new Set(Array.from(checkboxes).map(c => c.dataset.scope))];
      checkboxes.forEach(chk => {
        chk.addEventListener('change', () => {
          updateProgress();
          updateProgress(chk.dataset.scope);
        });
      });
      updateProgress();
      scopes.forEach(scope => updateProgress(scope));

      const darkMode = localStorage.getItem("darkMode");
      if (darkMode === "enabled") document.body.classList.add("dark");
      document.getElementById("darkModeToggle").addEventListener("click", () => {
        document.body.classList.toggle("dark");
        const isDark = document.body.classList.contains("dark");
        localStorage.setItem("darkMode", isDark ? "enabled" : "disabled");
      });
    });

    function navigateTo(targetId) {
      const allDetails = document.querySelectorAll("details");
      allDetails.forEach(d => d.removeAttribute("open"));
      const section = document.getElementById(targetId);
      if (section) {
        const details = section.querySelector("details");
        if (details) {
          details.setAttribute("open", true);
          details.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }
    }
  </script>
</body>
</html>
